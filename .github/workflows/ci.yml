name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cog check needs full history to walk commits since the last tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      # Debug step: running `cog` directly (rather than through the
      # action's `command:` input) so real errors are visible in the log.
      # cog.sh captures the command's output via `stdout="$(cog ... 2>&1)"`
      # under `set -e`, so a failing `cog` call aborts the script right
      # there, before the line that would print `$stdout` — the log then
      # only shows "Process completed with exit code 1" with no
      # explanation (confirmed present in v4.0.0 through v4.2.0). Revert to
      # the action-recommended form below once that's fixed upstream:
      #
      # - name: Check commit messages
      #   uses: cocogitto/cocogitto-action@v4.2.0
      #   with:
      #     command: check
      #     args: --from-latest-tag
      - run: cog check --from-latest-tag

  release:
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-edit
      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      # Debug step: see the comment in the `test` job above for why this
      # runs `cog` directly instead of the action-recommended form below.
      #
      # - name: Bump version
      #   id: release
      #   uses: cocogitto/cocogitto-action@v4.2.0
      #   with:
      #     command: bump
      #     args: --auto
      #     git-user: github-actions[bot]
      #     git-user-email: github-actions[bot]@users.noreply.github.com
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cog bump --auto
      - run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: |
          TAG="$(git describe --tags --abbrev=0)"
          cog changelog --at "$TAG" > release-notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
