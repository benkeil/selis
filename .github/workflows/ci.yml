name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cog check needs full history to walk commits since the last tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check commit messages
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
          args: --from-latest-tag
      # Debug fallback if this ever fails with no useful error: cog.sh
      # captures output via `stdout="$(cog ... 2>&1)"` under `set -e`, so a
      # failing `cog` call aborts the script before the line that would
      # print `$stdout` — the log then only shows "Process completed with
      # exit code 1" (confirmed in v4.0.0 through v4.2.0). Swap to running
      # `cog` directly to see the real error:
      # - run: cog check --from-latest-tag

  release:
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-edit
      - name: Bump version
        id: release
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: bump
          args: --auto
          git-user: github-actions[bot]
          git-user-email: github-actions[bot]@users.noreply.github.com
      # Debug fallback: see the comment in the `test` job above.
      # - run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     cog bump --auto
      - run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: |
          TAG="$(git describe --tags --abbrev=0)"
          cog changelog --at "$TAG" > release-notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
